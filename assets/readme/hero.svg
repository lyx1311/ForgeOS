<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ForgeOS — persistent engineering from intent to evidence</title>
  <desc id="desc">A project-native diagram showing a natural-language request becoming a versioned plan, isolated code changes, exact-commit evidence, and a local preview.</desc>
  <rect width="1200" height="430" rx="28" fill="#0B0D0F"/>
  <path d="M0 88H1200M0 352H1200" stroke="#272B30"/>
  <path d="M810 0V430" stroke="#272B30"/>

  <g transform="translate(60 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="600" letter-spacing="2">
      <rect width="170" height="32" rx="16" fill="#FF6B35"/>
      <text x="85" y="22" text-anchor="middle" fill="#0B0D0F">LOCAL · v0.1.0</text>
    </g>
    <text y="126" fill="#F4F1EA" font-size="78" font-weight="750" letter-spacing="-3">ForgeOS</text>
    <text y="177" fill="#F4F1EA" font-size="28" font-weight="600">Persistent engineering, from intent to evidence.</text>
    <text y="218" fill="#9BA1A8" font-size="21">Describe a Node web app. Approve the plan.</text>
    <text y="249" fill="#9BA1A8" font-size="21">ForgeOS builds, tests, reviews, merges, and previews it.</text>

    <g transform="translate(0 288)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <rect width="690" height="68" rx="12" fill="#14171A" stroke="#343A40"/>
      <circle cx="24" cy="21" r="5" fill="#FF6B35"/>
      <circle cx="43" cy="21" r="5" fill="#626A73"/>
      <circle cx="62" cy="21" r="5" fill="#626A73"/>
      <text x="24" y="49" fill="#D9D5CC"><tspan fill="#FF8A5B">›</tspan> Build a habit tracker with streak statistics</text>
    </g>
  </g>

  <g transform="translate(846 42)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text fill="#9BA1A8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="1.5">DELIVERY LEDGER</text>
    <path d="M24 52V318" stroke="#343A40" stroke-width="2"/>
    <g font-size="20" font-weight="650">
      <g transform="translate(0 66)"><circle cx="24" cy="0" r="9" fill="#FF6B35"/><text x="50" y="7" fill="#F4F1EA">Analysis</text><text x="286" y="7" text-anchor="end" fill="#7F8790" font-size="18">FACTS</text></g>
      <g transform="translate(0 114)"><circle cx="24" cy="0" r="9" fill="#FF6B35"/><text x="50" y="7" fill="#F4F1EA">Plan approval</text><text x="286" y="7" text-anchor="end" fill="#7F8790" font-size="18">DAG</text></g>
      <g transform="translate(0 162)"><circle cx="24" cy="0" r="9" fill="#FF6B35"/><text x="50" y="7" fill="#F4F1EA">Implementation</text><text x="286" y="7" text-anchor="end" fill="#7F8790" font-size="18">GIT</text></g>
      <g transform="translate(0 210)"><circle cx="24" cy="0" r="9" fill="#FF6B35"/><text x="50" y="7" fill="#F4F1EA">Test + review</text><text x="286" y="7" text-anchor="end" fill="#7F8790" font-size="18">SHA</text></g>
      <g transform="translate(0 258)"><circle cx="24" cy="0" r="9" fill="#FF6B35"/><text x="50" y="7" fill="#F4F1EA">Fast-forward</text><text x="286" y="7" text-anchor="end" fill="#7F8790" font-size="18">MAIN</text></g>
      <g transform="translate(0 306)"><circle cx="24" cy="0" r="12" fill="#0B0D0F" stroke="#FF6B35" stroke-width="4"/><circle cx="24" cy="0" r="4" fill="#FF6B35"/><text x="50" y="7" fill="#F4F1EA">Local preview</text><text x="286" y="7" text-anchor="end" fill="#FF8A5B" font-size="18">READY</text></g>
    </g>
  </g>
</svg>
